<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Automations</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <header>
    <h1>YouTube Automations</h1>
    <div id="status-bar">Loading…</div>
  </header>

  <section class="panel">
    <h2>Generate video</h2>
    <form id="generate-form">
      <input type="text" id="topic" placeholder="Topic e.g. 15 min morning desk stretch" required />
      <select id="duration">
        <option value="1" selected>1 min (quick test)</option>
        <option value="3">3 min</option>
        <option value="8">8 min</option>
        <option value="12">12 min</option>
        <option value="15">15 min</option>
      </select>
      <select id="audio">
        <option value="music_only">Music only</option>
        <option value="coach_voice">Coach voice</option>
      </select>
      <button type="submit">Generate</button>
      <button type="button" id="btn-quick-test" class="secondary">Quick test (1 min + voice)</button>
    </form>
    <p class="hint">music_only needs MP3s in assets/music/. Use coach_voice for AI narration. Regenerate after fixes.
    </p>
  </section>

  <section class="panel actions">
    <button id="btn-research">Refresh competitor research</button>
    <button id="btn-auth">YouTube OAuth</button>
    <button id="btn-refresh">Refresh jobs</button>
  </section>

  <section class="panel">
    <h2>Jobs</h2>
    <div id="jobs"></div>
  </section>

  <script src="/app.js"></script>
</body>

</html>
